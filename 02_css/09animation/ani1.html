<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background: blue;

      /* 2가지 속성은 필수세트, 없으면 바뀌지 않음*/
      animation-name: changeBg;
      animation-duration: 3s;
      animation-iteration-count: 3; /* 반복 횟수 */
      animation-direction: alternate; 
      /* alternate */
    }

    @keyframes changeBg {
      /* from to 0% 100% */
      from{
        background: blue;
      }
      to{
        background: red;
        border: 1px solid yellowgreen;
        border-radius: 50%;
      }
    }
  </style>
</head>

<body>
  <div class="box"></div>
</body>

</html>
