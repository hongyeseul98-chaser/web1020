<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>margin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      width: 200px;
      height: 100px;
      background: blue;
      text-align: center;
      line-height: 100px;
      color: white;
    }

    .box1 {
      margin: 30px 50px;
    }
    .box2 {
      margin: 30px 5px 50px;
      margin-left: 300px;
    }
    .box3 {
      margin: 100px;
      display: inline-block; /* 인라인 블록: 블록 요소이지만 한 줄에 나란히 배치 가능 */
    }
    .box4 {
      display: inline-block;
      margin-left: 150px;
    }
  </style>
</head>
<body>
  <div class="box1">박스1</div>
  <div class="box2">박스2</div>
  <div class="box3">박스3</div>
  <div class="box4">박스4</div>
</body>
</html>
