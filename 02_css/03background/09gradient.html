<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gradiation background</title>
  <style>
    div {
      width: 500px;
      height: 500px;
      margin: 10px;
    }

    .gr1 {
      background: linear-gradient(135deg, #ff8a1e 0%, #ffe2a6 100%);
    }

    .gr2 {
      background: radial-gradient(circle at 50% 50%, #67e8f9 0%, #f0abfc 100%);
    }

    .gr3 {
      background-color: #f0abfc;
      background-image:
        linear-gradient(132deg, rgba(255, 255, 255, .55), transparent 34%, rgba(255, 255, 255, .28) 58%, transparent 76%),
        conic-gradient(from 132deg at 50% 50%, #67e8f9, color-mix(in oklch, #67e8f9 35%, white), #f0abfc, color-mix(in oklch, #f0abfc 42%, black), #67e8f9);
      background-blend-mode: screen, normal;
    }

    .gr4 {
      background:
        linear-gradient(145deg, color-mix(in oklch, #22c55e 18%, white), transparent 62%),
        radial-gradient(ellipse at 20% 30%, #22c55e 0 18%, transparent 52%),
        radial-gradient(ellipse at 78% 42%, #3b82f6 0 20%, transparent 56%),
        linear-gradient(180deg, color-mix(in oklch, #3b82f6 38%, white), color-mix(in oklch, #22c55e 24%, black));
    }

    .gr5 {
      background-color: #fb7185;
      background-image:
        linear-gradient(118deg, rgba(255, 255, 255, .62), transparent 22%, rgba(255, 255, 255, .18) 42%, transparent 68%),
        radial-gradient(circle at 16% 20%, color-mix(in oklch, #22d3ee 82%, white) 0 16%, transparent 36%),
        conic-gradient(from 118deg at 62% 46%, #22d3ee, color-mix(in oklch, #22d3ee 40%, #fb7185), #fb7185, color-mix(in oklch, #fb7185 42%, white), #22d3ee);
      background-blend-mode: screen, lighten, normal;
    }

    .gr6 {
      background-color: #14b8a6;
      background-image:
        radial-gradient(circle at 14% 18%, color-mix(in oklch, #fb7185 88%, white) 0 20%, transparent 44%),
        radial-gradient(circle at 88% 28%, color-mix(in oklch, #14b8a6 78%, white) 0 18%, transparent 42%),
        radial-gradient(circle at 66% 88%, color-mix(in oklch, #fb7185 38%, #14b8a6) 0 22%, transparent 48%),
        linear-gradient(142deg, color-mix(in oklch, #fb7185 12%, white), color-mix(in oklch, #14b8a6 32%, black));
      background-blend-mode: screen, lighten, multiply, normal;
    }
  </style>
</head>

<body>
  <div class="gr1"></div>
  <div class="gr2"></div>
  <div class="gr3"></div>
  <div class="gr4"></div>
  <div class="gr5"></div>
  <div class="gr6"></div>
</body>

</html>
