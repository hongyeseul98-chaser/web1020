<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color 속성</title>
  <style>
    body{
      background: lightcoral;
    }
    .hax {
      color: #f0f;
    }
    .rgb {
      color: rgba(213, 13, 13, 1);/* 1은 불투명, 0은 투명 */
      color: rgb(213, 13, 13);
    }
    .hsl {
      color: hsl(0, 88%, 44%);
    }
    .col {
      color: wheat;
    }
    div {
      width: 100px;
      height: 50px;
      background-color: rgba(23, 130, 130, 0.5); /* 배경만 반투명 */
      /* opacity: 0.5;  글자와 배경 모두 투명 */
    }
  </style>
</head>

<body>
  <h1>color 속성</h1>
  <ul>
    <li>글자색 지정</li>
    <li>
      <span class="hax">16진수 값(HAX 코드), </span>
      <span class="rgb">RGB 값 , </span>
      <span class="hsl">HSL 값 , </span>
      <span class="col">색상 이름</span>
    </li>
  </ul>
  <div>rgba</div>
</body>

</html>
