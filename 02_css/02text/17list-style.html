<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리스트 스타일</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    ul,
    ol {
      width: 700px;
      margin: 0 auto;
      border: 1px solid #ccc;
    }

    ul {
      list-style-type: none;
      /* 기본 리스트 스타일 제거 */
      list-style: decimal-leading-zero inside;
      /* 숫자 앞에 0을 붙이고 안쪽에 표시 */
    }

    ol {
      list-style-position: inside;
      /* 리스트 아이템 안쪽에 표시 */
      list-style: disc;
      /* 기본 리스트 스타일은 원형 */
    }
    .img_ul {
      list-style-image: url('./home.png');
      /* 이미지 리스트 스타일 */
      list-style: url('./home.png') inside;
    }
    .check_list {
      list-style-type: 'v';
      /* 체크 모양 리스트 스타일 */
    }
  </style>
</head>

<body>
  <ul>
    <li>순서목록</li>
    <li>순서목록</li>
    <li>순서목록</li>
    <li>순서목록</li>
    <li>순서목록</li>
  </ul>

  <ol>
    <li>순서목록</li>
    <li>순서목록</li>
    <li>순서목록</li>
    <li>순서목록</li>
    <li>순서목록</li>
  </ol>

  <ul class="img_ul">
    <li>목록</li>
    <li>목록</li>
    <li>목록</li>
    <li>목록</li>
    <li>목록</li>
  </ul>

  <ol class="check_list">
    <li>순서목록 바꾸기</li>
    <li>순서목록 바꾸기</li>
    <li>순서목록 바꾸기</li>
    <li>순서목록 바꾸기</li>
    <li>순서목록 바꾸기</li>
  </ol>
</body>

</html>
