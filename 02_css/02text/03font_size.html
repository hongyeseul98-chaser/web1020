<body>
  <!DOCTYPE html>
  <html lang="ko">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹폰트 적용</title>
    <style>
      /* html, :root는 같은 의미 */
      :root {
        font-size: 100px;
      }

      .px40 {
        font-size: 40px;
      }

      /* em과 rem의 차이
         em은 부모 요소(40px=1em)의 폰트 크기를 기준으로 하고,
         rem은 루트 요소(html)의 폰트 크기를 기준으로 한다.
      */
      .em4 {
        font-size: 4em;
      }

      .rem4 {
        font-size: 4rem;
      }
    </style>
  </head>

  <body>
    <div class="px40">
      <p>기본 사이즈</p>
      <p class="em4">4em</p>
      <p class="rem4">4rem</p>
    </div>
  </body>

  </html>
</body>

</html>
