<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scale</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    ul {
      list-style: none;
      width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
    }

    ul li {
      width: 200px;
      height: 150px;
      overflow: hidden;
    }
    ul li a {
      display: block;
      width: 100%;
      height: 100%;
    }
    ul li a img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .6s;
    }

    ul li:hover a img {
      transform: scale(2);
    }
  </style>
</head>

<body>
