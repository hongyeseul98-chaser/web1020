<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>translate</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .container div {
      width: 200px;
      height: 200px;
      margin: 100px;
      border: 1px solid #000;
      float: left;
    }

    .container div p {
      width: 100%;
      height: 100%;
      background: blue;
      opacity: .3;
      color: #fff;
      font-size: 30px;
      display: flex;
      /* 글씨 중앙 정렬을 위해 flex 사용 */
      justify-content: center;
      /* 주축 중앙 정렬(여기서는 가로) */
      align-items: center;
      /* 교차축 중앙 정렬(여기서는 세로) */
      transition: .3s;
      /* 부드럽게 이동*/
      cursor: pointer;
      /* 마우스 커서가 올려졌을 때 포인터로 변경 */
    }


    /* 컨테이너 안의 각 div에 마우스를 올렸을 때 p */

    /* child: 자식 선택자
    nth: n번째 자식 선택자
    last: 마지막 자식 선택자 */

    /* 3번째 자식 */
    .container div:nth-child(3):hover p {
      transform: translateX(100px);
    }

    /* 자식들 중 div와 같은 타입의 (2)번째 자식 */
    .container div:nth-of-type(2):hover p {
      transform: translateY(-100px);
    }


    /* 마지막 자식, last-of-type과 동일 */
    .container div:last-child:hover p {
      transform: translate(-50px, -50px);
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>translate : x축이나 y축으로 이동</h2>
    <p>translate는 현재 요소의 위치값을 기준으로 x축 또는 y축으로 해당 요소를 이동시킨다</p>

    <div>
      <p>1</p>
    </div>
    <div>
      <p>2</p>
    </div>
    <div>
      <p>3</p>
    </div>
  </div>

</body>

</html>
