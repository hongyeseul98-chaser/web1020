<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>card 뒤집기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }

    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      /* 기준점 잡기 */
      transform-origin: top center;
      transform-style: preserve-3d;

    }

    .con:hover .card {
      transform: rotateX(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back {
      transform: rotateX(180deg);
      /* backface-visibility: hidden; */

    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img
          src="https://i.namu.wiki/i/lhFt5LbxCBbKMgM2v5kHoYU6qahjDeG_Ytw1Tjld4pW65-8LNthLCWYWvJfJ_kimQB4vp_sfcdx3qnq5bjYZmQ.webp"
          alt="양정원앞면"></div>
      <div class="face back"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIM8uiN85LfPuym680lHEpBCYeM37L8PG8snNS9yrMK5LB5Uqqtq-NaYVT&s=10"
          alt="양정원뒷면"></div>
    </div> <!-- //.card -->
  </div> <!-- //.con -->
</body>

</html>
