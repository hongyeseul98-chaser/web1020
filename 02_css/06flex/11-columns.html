<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>columns</title>
  <link rel="stylesheet" href="default.css">
  <!--반응형 -->
  <style>
    .flex_container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      /* 주축이 세로 방향, 교차축이 가로방향이 됨, height 값을 나눠 가질 예정*/
    }

    .flex_item {
      flex: 1 auto;
    }

    /* media 는 화면 크기에 따라 레이아웃을 변경할 때 사용 */
    @media screen and (min-width:600px) {
      .flex_container {
        flex-flow: row wrap;
        /* row: 화면이 600px 이상일 때 가로 방향으로 배치하고, wrap: 필요시 줄바꿈 */
      }

      .flex_item {
        width: 50%;
      }
    }

    @media screen and (min-width:900px) {
      .flex_item {
        width: 30%;
      }
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">AAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCC</div>
    <div class="flex_item">AAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCC</div>
    <div class="flex_item">AAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCC</div>
  </div>
</body>

</html>
