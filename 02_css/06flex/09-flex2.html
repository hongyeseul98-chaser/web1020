<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      flex-wrap: wrap;
      width: 1360px;
      margin: 0 auto;
    }

    .flex_item{
      flex: 1 1 auto;
    }
    .flex_item:nth-child(1){
      width: 30%;
    }
    .flex_item:nth-child(2){
      width: 60%;
      /* 나머지 10% 는 1,2 가 flex-grow 로 채우게 됨 */
    }
    .flex_item:nth-child(3){
      width: 20%;
    }
  </style>
</head>
<body>
  <div class="flex_container">
    <div class="flex_item">
      <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Laboriosam adipisci, tempore rem velit veritatis tenetur distinctio accusamus assumenda error animi quia consequuntur odio dicta a beatae commodi ducimus, necessitatibus quisquam.</p>
    </div>
    <div class="flex_item">bbb</div>
    <div class="flex_item">cccccccccc</div>
</body>
</html>
