<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-grow</title>
  <!-- 유연하게 늘리기 / 컨테이너에 남는 공간이 있을 때 어떻게 나눌지 지정, 기본값 0 
   반응형 레이아웃에 유용
  -->
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      height: 100px;
    }

    .flex_item {
      flex-grow: 2;
      /* 컨테이너에 남는 공간을 다른 아이템과 비율 2:2:2로 나눔 */

      /* flex-grow는 아이템이 flex-basis의 값보다 커질 수 있는지를 결정하는 속성
      flex-basis를 제외한 여백 부분을 flex-grow 에 지정된 숫자의 비율로 나누어 가짐, 기본값이 0
      */
    }

    .flex_item:nth-child(1) {
      flex-grow: 1;
      /* 첫 번째 아이템은 컨테이너에 남는 공간을 다른 아이템과 비율 1:2:2로 나눔 */
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaa</div>
    <div class="flex_item">bbb</div>
    <div class="flex_item">cccc</div>
  </div>
</body>

</html>
