<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-wrap</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      width: 700px;
      flex-wrap: nowrap; /* 기본값 : 아이템들이 한 줄에 다 들어가도록 함, 넘쳐도 줄바꿈하지 않음 */
      flex-wrap: wrap; /* 아이템들이 한 줄에 다 안 들어가면 다음 줄로 넘김 */
      flex-wrap: wrap-reverse; /* 아이템들이 한 줄에 다 안 들어가면 다음 줄로 역순으로 넘김, 주축은 가로 🔥*/
      /* gap: 20px; */
      row-gap: 20px;
      column-gap: 10px; 
    }

  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA</div>
    <div class="flex_item">BBBBBBBBBBBBBBBBBBBBBBBB</div>
    <div class="flex_item">
      CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
    </div>
  </div>
</body>

</html>
