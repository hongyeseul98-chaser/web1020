<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>align-items</title>
  <!-- 교차축 정렬 -->
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      width: 800px;
      height: 300px;
      align-items: stretch;
      /* 기본값: 아이템들이 교차축 방향으로 늘어남, 아이템들을 컨테이너의 높이에 맞게 늘림 */
      align-items: flex-end;
      /* 아이템들을 교차축의 끝점으로 정렬 */
      align-items: center;
      /* 아이템들을 교차축의 중앙으로 정렬 */
      align-items: flex-start;
      /* 아이템들을 교차축의 시작점으로 정렬 */
      /* align-items: baseline;  */
      /* 아이템들을 교차축의 기준선에 맞춤 */
    }

    .flex_item:nth-child(1) {
      font-size: 30px;
    }

    .flex_item:nth-child(2) {
      font-size: 12px;
    }

    .flex_item:nth-child(3) {
      font-size: 50px;
      align-self: center;
      /* 개별 아이템을 교차축의 중앙으로 정렬 */
    }

    .parent {
      margin-top: 50px;
      justify-content: center;
      /* 아이템들을 주축의 중앙으로 정렬 */
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaa</div>
    <div class="flex_item">bbb</div>
    <div class="flex_item">cccc</div>
  </div>
  <div class="flex_container parent">
    <div class="flex_item">cccc</div>
  </div>
</body>

</html>
