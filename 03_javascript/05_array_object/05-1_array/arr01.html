<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열 리터럴로 생성하기</title>
</head>

<body>
  <script>
    //let 배열명 = [원소1, 원소2, 원소3, ...];
    let city = ['서울', '부산', '인천', '대전', '대구'];
    console.log(city[2]); // 인덱스 2에 해당하는 요소 출력
    city[2] = '바꿈'; // 인덱스 2에 해당하는 요소를 '바꿈'으로 변경


    // printArr 함수를 호출하면 city 배열의 모든 요소가 화면에 출력됨
    function printArr() {

      // city 배열의 모든 요소를 반복문을 통해 출력
      // length 속성을 사용하여 배열의 길이만큼 반복
      for (let i = 0; i < city.length; i++) {
        document.write(city[i] + '<br>');
        // city[i]는 현재 반복 중인 인덱스 i에 해당하는 요소를 의미함
      }
    }


  </script>
  <button type="button" onclick="printArr()">배열함수 호출</button>
</body>

</html>
