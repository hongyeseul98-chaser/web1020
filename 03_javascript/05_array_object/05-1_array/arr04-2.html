<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배열</title>
</head>

<body>
  <script>

    /*
  배열을 객체로 생성- 좋아하는 연예인 5명
  함수선언 =  for in문 으로 출력  alert
  배열데이터[0] : 송중기
  */

    let talent = new Array(5);
    function insertTal(){
      //for in 문은 실제로 값이 할당된 인덱스만 순회
      for(let i=0; i<talent.length; i++) {
        talent[i] = prompt(`좋아하는 연예인을 입력하세요 ${Number(i)+1}`);
      }
    }

    function printTal (){
      insertTal();
      for(let i in talent) {
        alert(`배열데이터[${i}] : ${talent[i]}`);
      }
    } 
    //printTal();


  </script>

  <button type="button" onclick="printTal()">사람 나와라</button>
</body>

</html>
