<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math</title>
</head>

<body>
  <script>
    let num = 2.1234;
    let maxNum = Math.max(10, 5, 8, 30); //최대값
    console.log(maxNum);

    let minNum = Math.min(10, 5, 8, 30); //최소값
    console.log(minNum);

    let roundNum = Math.round(num); //소수점 첫째자리 반올림
    console.log(roundNum); //반올림 결과 출력

    let floorNum = Math.floor(num); //소수점 첫째자리 내림
    console.log(floorNum); //내림 결과 출력

    let ceilNum = Math.ceil(num); //소수점 첫째자리 올림
    console.log(ceilNum); //올림 결과 출력

    let piNum = Math.PI; //원주율 상수 반환
    console.log(piNum); //원주율 출력

    let rNum = Math.random(); //0 부터 1 사이의 난수 반환
    console.log(rNum); //난수 출력 , 계속 실행할 때마다 다른 값이 나옴

    let rNum2 = Math.random() * 10; //0 부터 10 사이의 난수 반환
    console.log(rNum2);

    let rNum3 = Math.floor(rNum2); //0 부터 9 사이의 정수
    console.log(rNum3);
  </script>
</body>

</html>
