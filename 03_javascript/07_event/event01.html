<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mouse event</title>
</head>

<body>
  <button type="button" id="btn">클릭해보세요</button>
  <script>
    const btn = document.getElementById('btn');
    // 1. 기본적인 마우스 이벤트 (사용자가 직접 마우스를 클릭했을 때 실행)
    btn.addEventListener('click', (e) => {
      console.log('버튼이 클릭됨', e);
    });
    

    //2. 프로그래밍적으로 이벤트를 직접 발생시키기 (코드로 클릭 이벤트를 트리거)
    const clickEvent = new Event('click', {
      bubbles:true,  
      // 이벤트가 부모 요소로 전파될 수 있도록 여부를 설정함
      //객체의 버블링 속성을 true로 설정하여 이벤트가 상위 요소로 전파되도록 함
      cancelable:true, //preventDefault() 메서드를 사용하여 이벤트의 기본 동작을 허용할 수 있는지 여부를 설정함
    });


    //3. 일정시간 뒤에 강제로 버튼을 클릭한 것처럼 이벤트 발생시키기
    setTimeout(()=>{
      console.log('js에서 강제로 클릭 이벤트 발생');
      btn.dispatchEvent(clickEvent);
    },2000);


  </script>
</body>

</html>
