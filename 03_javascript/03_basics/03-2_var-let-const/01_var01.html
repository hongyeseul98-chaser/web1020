<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>var 변수</title>
</head>
<body>
  <script>
    var num1; // num1 변수를 선언 -> undefined
    console.log(num1);

    var num1 = 2; // num1 변수에 값을 할당 -> 초기화
    console.log(num1);

    num1 = '문자열';
    console.log(num1);

  </script>
</body>
</html>
