<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>undefined 데이터</title>
</head>
<body>
  <script>
    // undefined 데이터는 변수를 선언하였으나 값을 할당하지 않은 상태를 의미
    let temp;
    console.log(temp); // console: 출력해라

    // 객체의 속성값을 지정하지 않았을 경우 자동으로 지정되는 값
    let obj = {name: '홍길동', age: 18};
    obj.job = '디자이너';
    console.log(obj.name);
    console.log(obj.age);
    console.log(obj.job);
    console.log(obj.job2);
  </script>
</body>
</html>
