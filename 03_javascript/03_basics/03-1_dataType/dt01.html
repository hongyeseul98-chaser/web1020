<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자(number) 데이터</title>
</head>
<body>
  <script>
    // number 데이터는 정수, 소수점, 지수를 표현할 수 있다
    let num1 = 10; // 정수
    console.log(num1); // 정수 출력

    let num2 = 10.5; // 소수점
    console.log(num2); // 소수점 출력

    let num3 = 2e+2; // 지수. 2 * 10^2
    console.log(num3); // 지수 출력

  </script>
</body>
</html>
