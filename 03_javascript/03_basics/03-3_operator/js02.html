<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나머지 연산</title>
</head>
<body>
  <script>
    let evenOdd = prompt('숫자를 입력하세요'); //사용자에게 숫자를 입력받음
    evenOdd = Number(evenOdd); //입력받은 값(문자열)을 숫자로 변환
    
    let comment; //선언 상태
    if (evenOdd %2 ===0) {
      comment = evenOdd + '는 짝수입니다.';
    } else {
      comment = evenOdd + '는 홀수입니다.';
    }//if 를 만나서 짝수가 맞으면 값이 comment에 담고, 아니면 else에서 홀수 comment에 담김

    document.write(comment); //화면에 뜨는 내용


  </script>
</body>
</html>
