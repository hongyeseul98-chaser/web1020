<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼항 조건 연산자 test</title>
</head>

<body>
  <script>
    //num이라는 변수에 prompt로 숫자를 받아와서-초기화, 두줄말고 한줄
    let num = Number(prompt('숫자를 입력하세요'));

    //result라는 변수에 num 변수가 퍼센트계산 (%) = 짝수
    let result = num % 2;

    //삼항조건 연산자 사용, 변수사용하는 삼항조건
    //comment 라는 변수에
    //num은 짝수입니다, 홀수입니다

    //ver1.
    let comment = (result === 0) ? '은 짝수입니다' : '은 홀수입니다';

    //ver2.
    //let comment = (result === 0) ? `${num}은 짝수입니다` : `${num}은 홀수입니다`;

    //ver3. 헷갈리니까 쓰지마셈
    //let comment = result ?  `${num}은(는) 홀수 입니다`:`${num}은(는) 짝수 입니다`; 

    
    //comment가 h2태그로 뜨게
    //ver1.
    document.write('<h2>' + num + comment + '</h2>');

    //ver2.
    //document.write(`<h2>${comment}</h2>`);





  </script>
</body>

</html>
