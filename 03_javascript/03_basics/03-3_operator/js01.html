<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>산술연산자</title>
</head>

<body>
  <script>
    const num1 = 15;
    const num2 = 2;
    let result; //담을 변수 선언
    console.log(result);

    result = num1 + num2;
    console.log(result);

    result = num1 - num2;
    console.log(result);

    result = num1 * num2;
    console.log(result);

    result = num1 / num2;
    console.log(result);

    result = num1 % num2;
    console.log(result); //나누고 나머지 값이 나옴


  </script>
</body>

</html>
