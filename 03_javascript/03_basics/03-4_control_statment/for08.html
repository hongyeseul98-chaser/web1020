<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      float: left;
      border: 1px solid #ccc;
      width: 200px;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- <div id="box">
    <h1></h1>

  </div> -->

  <script>
    //구구단을 찍는데 변수 x y사용해서
    //div로 단을 묶고
    //1~9단 <h1>

    //document.write('<p>' + i + '</p>');

    for (let x = 1; x < 10; x++) {

      document.write('<div>');

      document.write('<h1>' + x + '단</h1><br>');

      for (let y = 1; y <= 10; y++) {
        document.write(y + 'x' + x + '=' + (y * x) + '<br>');
        //document.write(`${x} x ${y} = $(x*y) <br>`);

        document.write('</div>');
      }

    }
    //document.querySelector('#box').innerHTML= `<p> ${x} </p>`;
    //'<p>' + y+ '</p>';

  </script>
</body>

</html>
