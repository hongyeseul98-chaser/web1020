<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서가 없는 목록</title>
  <style>
    ul{
      list-style: decimal;
    }
    ol{
      list-style: disc;
    }
  </style>
</head>
<body>
  <ul> <!-- 블록 -->
    <li>체리</li> <!-- 블록 -->
    <li>복숭아</li>
    <li>딸기</li> 
    <li>포도</li> 
  </ul>
  <ol> <!-- 블록 -->
    <li>체리</li>
    <li>복숭아</li>
    <li>딸기</li>
    <li>포도</li>
  </ol>
</body>
</html>
