<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서 목록</title>
</head>

<body>
  <ol> <!-- 단축키 li*3 탭키 -->
    <li>첫 번째</li>
    <li>두 번째</li>
    <li>세 번째</li>
  </ol>

  <section>
    <h2>커피 드립 순서 - 알파벳 대문자 역순</h2> <!-- 블록 -->
    <ol type="A" reversed> <!-- 블록 --><!-- type 속성 : A, a, I, i, 1  컨트롤 스페이스바 맥북버전 알아보기-->
      <li>필터접기</li><!-- 블록 -->
      <li>분쇄</li>
      <li>불림</li>
      <li>추출</li>
    </ol>
  </section>

  <section>
    <h2>커피 드립 순서 - 아라비아 숫자 3부터</h2>
    <ol start="3"> <!-- -->
      <li>필터접기</li>
      <li>분쇄</li>
      <li>불림</li>
      <li>추출</li>
    </ol>
  </section>
</body>

</html>
