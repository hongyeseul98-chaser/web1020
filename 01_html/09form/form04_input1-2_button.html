<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>button</title>

  <!-- 알아둘 것
    ① button과 input의 버튼 관련 type
      submit: form에 입력한 내용을 전송
      reset: form에 입력한 내용을 초기화
      button: 기본 동작이 없는 일반 버튼
      image: 이미지 형태의 전송 버튼

    ② input과 button의 차이
      input: type에 따라 버튼의 모양과 기능이 정해짐
      button: 태그 안에 텍스트나 img 등을 넣어 버튼을 구성할 수 있음

    ③ form 안에서 button의 기본 type
      button에 type을 지정하지 않으면 기본적으로 submit으로 동작함
      일반 버튼을 만들 때는 type="button"을 명시하는 것이 안전함

    ④ onclick
      버튼을 클릭했을 때 실행할 동작을 지정하는 이벤트 속성
      window.open()은 새 창 또는 새 탭을 여는 데 사용함
  -->

  <!-- 헷갈릴 부분
    ① submit과 button은 같지 않아요
      submit: form을 전송하는 기능이 있음
      button: 자체적으로 전송 기능이 없음
      단, button에 type="submit"을 지정하면 전송 버튼이 됨

    ② reset은 입력값을 완전히 삭제하는 기능이 아니에요
      form 요소의 초기값으로 되돌리는 기능
      value 등으로 지정한 초기값이 있다면 그 값으로 돌아감

    ③ input type="image"와 button 안의 img는 달라요
      input type="image": 이미지 자체가 전송 버튼
      button 안의 img: 이미지가 들어 있는 버튼
      button의 type에 따라 전송, 초기화, 일반 버튼으로 동작 가능

    ④ CSS의 background와 img는 역할이 달라요
      background: 요소의 배경을 꾸미는 속성
      img: HTML 문서에 실제 이미지를 삽입하는 태그

    ⑤ onclick에 window.open()만 작성하면
       열릴 주소가 지정되지 않은 상태예요
      실제 웹사이트를 열려면 window.open('URL')처럼
      열 주소를 지정해야 함
  -->

  <style>
    li {
      margin-bottom: 30px;
    }
    #btn {
      /* 배경색 투명 */
      background: transparent;
      /* border 없애기 */
      border: none;
      /* 커서를 포인터로 바꾸기 */
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form>
    <ul>
      <li><input type="text"></li>
      <li>
        <input type="submit" value="전송">
        <button type="submit">전송</button>
      </li>
      <li>
        <input type="reset" value="다시입력">
        <button type="reset">다시입력</button>
      </li>
      <li>
        <input type="image" src="./btn.png" alt="submit">
        <button type="submit" id="btn"><img src="./btn.png" alt="submit"></button>
      </li>
      <li>
        <input type="button" value="새탭열기" onclick="window.open()">
        <button type="button" onclick="window.open()">새탭열기</button>
        <!-- onclick -->
      </li>
    </ul>
  </form>
</body>
</html>
