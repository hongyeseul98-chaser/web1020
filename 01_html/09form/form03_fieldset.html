<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fieldset 태그</title>
</head>

<body>
  <form>
    <fieldset>
      <legend>개인정보</legend>
      <ul>
        <li>
          <label for="u_name">이름 : </label>
          <input type="text" id="u_name"><!-- _(언더바)를 쓰는 이유: 한꺼번에 클릭되서-->
        </li>
        <li>
          <label>메일주소 : </label>
          <input type="email" id="email">
        </li>
      </ul>
    </fieldset>

    <fieldset>
      <legend>로그인정보</legend>
      <ul>
        <li>
          <label>
            아이디 : <input type="text"/>
          </label>
        </li>
        <li>
          <label for="pw">비밀번호: </label>
          <input type="password" id="pw">
        </li>
      </ul>
    </fieldset>
  </form>
</body>

</html>
