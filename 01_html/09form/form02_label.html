<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>label 태그</title>
</head>
<body>
  <!-- form 요소에 label(텍스트) 태그 사용 -->

  <!-- 방법1: label 태그로 묶기 -->
   <label>
    아이디 (6자 이상) : 
    <input type="text">
   </label>

   <!-- 방법2: id for 사용 -->
    <label for="userid">아이디 (6자 이상) : </label>
    <input type="text" id="userid">

    
</body>
</html>
