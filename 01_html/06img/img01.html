<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 태그 (상대경로:현재 html 파일 기준으로 상대위치)</title>
  <style>
    body {
      background: #ccc;
    }
  </style>
</head>

<body>
  <!-- 
    img 태그의 속성
    src: 이미지 파일의 경로
          웹문서 파일의 위치를 기준으로 이미지 경로지정 - 상대경로
          서버에 파일이 올라가 있는 위치(확실한 주소)를 기준으로 이미지 경로지정 - 절대경로
    alt: 이미지가 로드되지 않았을 때 표시될 대체 텍스트
          화면 낭독기가 읽어줌
          이미지를 표시할 수 없는 경우 대체 텍스트를 표시
  -->
  <!-- 
    상대경로 표기방법
    ./ : 현재 폴더
    ../ : 상위 폴더
    images/ : 하위 폴더
  -->

  <!-- 현재폴더에 있는 이미지: html 과 이미지파일이 같은 폴더에 있다면, src="파일이름" 또는 "./파일이름" -->
  <img src="./01.webp" alt="허남준이미지" width="100"> <!-- ./ 점슬래쉬로 경로 확인 -->
  <img src="./02.jpeg" alt="허남준이미지" height="100" /> <!-- 단독태그라서 슬래쉬넣어도됨 -->

  <!-- 하위폴더에 있는 이미지: images라는 하위 폴더에 이미지 파일이 있을 경우, "하위폴더 이름/파일이름"으로 접근 -->
  <div>
    <img src="images/03.jpg" alt="허남준이미지" width="30%">
    <img src="images/04.jpeg" alt="허남준이미지" width="500" height="500">
  </div>

  <!-- 상위폴더에 있는 이미지: "../파일이름"으로 접근 -->
  <img src="../../02_css/kakao.png" alt="카카오톡로고">

  <!-- 
    width(가로사이즈), height(세로사이즈) 
   이미지 크기 조정하는 속성
   이 속성을 사용하지 않으면 원래 이미지 크기대로 표시
   이 속성을 이용해 화면에 표시하는 이미지 크기 조정, but 이미지 파일 용량은 그대로
  -->
</body>

</html>
