<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>video - 풀페이지</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    figure {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #container {
      position: absolute;
      left: 100px;
      top: 100px;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- 
  figure 태그 안에 video 태그를 넣어 비디오를 배경으로 사용
  playsinline: 모바일에서 자동 재생을 위해 필요 
  -->
  <figure>
    <video src="media/flower.mp4" id="bg" autoplay muted loop playsinline></video>
  </figure>
  <div id="container">
    <h2>Flower Video</h2>
  </div>

</body>

</html>
