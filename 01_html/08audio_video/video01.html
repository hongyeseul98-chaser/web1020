<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>video 태그 속성</title>
</head>

<body>
  <!-- 
        width height 비디오 크기 조절
        controls 미디어 파일에 컨트롤 막대 표시
        muted 비디오를 재생할때 소리는 끄고 화면만 재생
        autoplay 미디어 파일을 다운로드하자마자 자동으로 재생
        loop 미디어 파일을 반복 재생
    -->
  <video src="./media/Painting.mp4" controls loop autoplay muted width="800" height="400"></video>

  <!-- 
  controls: 재생, 일시정지, 볼륨조절, 전체화면 등 제어버튼 표시
  loop: 반복재생 

  autoplay: 자동재생
  muted: 음소거
  둘 다 써야 크롬에서 자동재생 가능
  -->
  <!-- 
  muted
   -->
</body>

</html>
