<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>video 재생하기 (source) 지원가능 브라우저를 위한 여러 버전</title>
</head>
<body>
  <video autoplay muted loop>
    <source src="./media/Painting.webm" type="video/webm"><!-- type 안 넣어도 되지만 찾기 쉬워짐 -->
    <source src="./media/Painting.mp4" type="video/mp4">
    이 영상을 보기 위해서는 html5를 지원하는 브라우저가 필요합니다.
  </video>
</body>
</html>
