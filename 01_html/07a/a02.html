<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>링크 연결(html파일링크 연결)</title>
</head>

<body>
  <!-- 
    a태그의 속성 
    href :  링크할 주소를 지정
            링크를 만들 텍스트/이미지를 <a>태그와</a>태그로 감쌈
    target :  링크를 열 때의 동작을 지정
              현재 페이지는 그대로 유지하면서 새창이나 새탭에 표시
              target="_blank"
                _blank: 새창이나 새탭에서 열기
                _self: 현재 창에서 열기 (기본값) 안써도됨
  -->
    <a href="./a01.html" target="_blank">a01.html로 바로가기</a>
</body>

</html>
